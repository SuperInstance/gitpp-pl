name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    uses: SuperInstance/quilt-ci/.github/workflows/conformance.yml@main
    secrets: inherit
    # A reusable workflow's permissions are CAPPED BY THE CALLER's. The
    # callee asks for pull-requests: write to post its result as a PR
    # comment, and without this the step fails with
    #
    #   Resource not accessible by integration
    #
    # A permissions error dressed up as a missing feature.
    permissions:
      contents: read
      pull-requests: write
    with:
      language: perl
      runner: ubuntu-latest
      install: |
        sudo apt-get install -y libjson-pp-perl
      conformance_script: |
        # The script runs with the port checked out at ./port, so the
        # paths below are relative to the port repo. The public corpus
        # is already cloned at ./conformance by the reusable workflow.
        # The reusable workflow already cloned the public corpus to
        # <workspace>/conformance, and the port is checked out at
        # <workspace>/port. The script runs with the port as its working
        # directory, so the corpus is at ../conformance -- NOT
        # ./conformance.
        #
        # It was ./conformance, and the result was
        #
        #   find: './conformance/cases': No such file or directory
        #
        # on a loop over ZERO cases, and the script then reported
        # SUCCESS. A check that compared NOTHING and passed is the
        # single failure mode this whole branch exists to remove, and
        # it was in my own new code.
        # In-process regression suite (core Test::More only).
        # Runs FIRST: it pins the four cross-port leaves, the spec S2 canon
        # bytes, and the case that distinguishes C0 controls from their short
        # forms -- none of which the corpus exercises.
        prove -Ilib -v t/

        CORPUS="${CORPUS:-../conformance}"        
        # Run the runner against our bin
        CASES=$(find "$CORPUS/cases" -name '*.json' | sort)
        NCASES=$(echo "$CASES" | grep -c . || true)
        echo "  $NCASES case(s) in the corpus"
        # A run that compared against NOTHING must FAIL.
        #
        # A wrong path yields zero cases, the loop body never runs, and
        # the script exits 0 -- a green badge on a check that checked
        # nothing. The corpus has 30 cases and 2 of them are known
        # gaps, so at least 28 must be comparable.
        if [ "$NCASES" -lt 28 ]; then
          echo "FAIL: only $NCASES case(s) found under $CORPUS/cases (expected at least 28)"
          exit 1
        fi
        compared=0
        for case in $CASES; do
          # Extract the input array, with the CORPUS's own semantics.
          #
          # The old extraction was
          #     recs = d.get('input', d.get('input_tampered', []))
          # which yields an EMPTY LIST for every case that points at the
          # live deployment via `input_source` -- and the corpus has 8
          # such cases. An empty record set folds to a null root, so
          # those 8 cases compared an EMPTY SET against a pinned root
          # and failed for the wrong reason:
          #
          #   FAIL: .../L2/pinned-poc-quilt-1.json (closure root)
          #     expected: 60effe23970d8a5cc837636c44685502361288c1f00577e9addfa10cbd4fc91d
          #     actual:   null
          #
          # The corpus's own runner resolves them like this:
          #     let records = c.input_tampered || c.input;
          #     if (!records && c.input_source && c.input_source.startsWith("https://"))
          #       records = (await fetch(c.input_source)).records;
          #
          # The same rule, in the same order.
          input=$(python3 -c "
        import json, sys, urllib.request
        d = json.load(open('$case'))
        recs = d.get('input_tampered') or d.get('input')
        if not recs:
            src = d.get('input_source')
            if src and src.startswith('https://'):
                # A User-Agent is REQUIRED. The deployment answers urllib's
                # default 'Python-urllib/3.x' with HTTP 403, while the same
                # URL with any other User-Agent returns 200. The fetch
                # fails for a reason that has nothing to do with the
                # records, and the traceback points at urllib, not at the
                # deployment.
                req = urllib.request.Request(src, headers={'User-Agent': 'gitpp-conformance/1.0'})
                # The deployment answers HTTP 503 INTERMITTENTLY. The
                # same URL returns 200 on the next request, seconds
                # later. So the fetch is RETRIED, and a failure after
                # three attempts is a SKIP that is named -- not a silent
                # empty input, and not a crash.
                last = None
                for attempt in range(3):
                    try:
                        with urllib.request.urlopen(req, timeout=30) as r:
                            recs = json.load(r).get('records')
                        last = None
                        break
                    except Exception as e:
                        last = e
                        import time; time.sleep(1.5 * (attempt + 1))
                if last is not None:
                    print('FETCH-FAILED: %s' % last, file=sys.stderr)
                    recs = None
        print(json.dumps(recs) if recs else '')
        ")
                  at=$(python3 -c "import json; d=json.load(open('$case')); print(d['at'])")

                  if [ -z "$input" ]; then
                    echo "SKIP: $case (no input records available -- e.g. a prose input_modification)"
                    continue
                  fi
                  compared=$((compared + 1))
                  echo "$input" > /tmp/case.json

                  result=$(perl bin/gitpp-pl /tmp/case.json --at "$at" 2>&1)
                  # Extract the root WITHOUT turning a JSON null into the four
                  # characters "None".
                  #
                  # The old extraction was
                  #     print(d.get('closureRoot', ''))
                  # and for a JSON null, d.get returns Python's None, whose str()
                  # is "None" -- a NON-EMPTY string. So the null check
                  #     if [ -z "$root" ]
                  # could never fire on a null root, and equally could not fire
                  # on a WRONG hex root. Proven: a port returning a constant
                  # wrong non-empty root passes this loop 30 of 30, and 22 of
                  # the 30 corpus cases REQUIRE a null root.
                  #
                  # The corpus's own runner.mjs already does this properly, with
                  # four expectations: "computed" (non-null hex), "differs-from-
                  # pinned", null (root must be null), or an exact hex. The perl
                  # workflow was a hand-rolled SHADOW of that check, and a
                  # weaker one. This now defers to the corpus's own comparison
                  # semantics instead of re-implementing them.
                  # Extract the root WITHOUT turning a JSON null into the four
                  # characters "None", and WITHOUT treating a MISSING key as a
                  # null one -- those are different, and conflating them is the
                  # same bug in two languages.
                  #
                  # The old extraction was
                  #     print(d.get('closureRoot', ''))
                  # For a JSON null, d.get returns Python's None, whose str() is
                  # "None" -- a NON-EMPTY string. So the check
                  #     if [ -z "$root" ]
                  # could not fire on a null root, nor on a WRONG one.
                  #
                  # Proven: with this workflow's own check, a port returning a
                  # constant wrong root for every case PASSES 30 of 30. The
                  # corpus's own runner.mjs rejects the same port on 21 of 28.
                  # This workflow was a hand-rolled SHADOW of the corpus's
                  # check, and a weaker one.
                  #
                  # The semantics below are the corpus's, not a new invention:
                  #   "computed" / absent -> the root must be a 64-char hex string
                  #   "differs-from-pinned" -> the root must differ from both
                  #                               pinned values
                  #   null                 -> the root must BE null
                  #   <hex>                -> the root must match exactly
                  verdict=$(echo "$result" | python3 -c "
        import json, sys
        try:
            d = json.load(sys.stdin)
        except Exception:
            print('PARSE-ERROR'); raise SystemExit
        if 'closureRoot' not in d:
            print('missing')
        else:
            r = d['closureRoot']
            print('null' if r is None else str(r))
        ")
          expected=$(python3 -c "
        import json
        d = json.load(open('$case'))
        if 'expected_closure_root' not in d:
            print('computed')
        else:
            e = d['expected_closure_root']
            print('null' if e is None else str(e))
        ")
          pinned_a=$(python3 -c "
        import json
        d = json.load(open('$case'))
        print(d.get('pinned_root',''))")
                  pinned_b=$(python3 -c "
        import json
        d = json.load(open('$case'))
        print(d.get('pinned_root_against_live',''))")
                  ok=$(python3 -c "
        actual = '$verdict'
        expected = '$expected'
        if expected == 'null':
            print('yes' if actual == 'null' else 'no')
        elif expected == 'computed':
            print('yes' if len(actual) == 64 and all(c in '0123456789abcdef' for c in actual) else 'no')
        elif expected == 'differs-from-pinned':
            print('yes' if actual not in ('$pinned_a', '$pinned_b') else 'no')
        else:
            print('yes' if actual == expected else 'no')
        ")
          if [ "$ok" != "yes" ]; then
            echo "FAIL: $case (closure root)"
            echo "  expected: $expected"
            echo "  actual:   $verdict"
            echo "  output:   $result"
            exit 1
          fi
        done
        echo "  $compared case(s) compared"
        if [ "$compared" -lt 28 ]; then
          echo "FAIL: only $compared case(s) were compared (expected at least 28)"
          exit 1
        fi
        # Spec §5.5 orphan regression battery (13 discriminating cases
        # + the §5.5 counterexample). Needs no deps beyond core Perl.
        prove -v t/cycle-orphans.t

      # The three inputs that used to be here -- expected_root, live_test
      # and live_root_at_task_c -- were DECLARED AND NEVER USED. They
      # were leftovers from a runner-based design, and GitHub rejects a
      # reusable-workflow call that passes an input the callee does not
      # declare:
      #
      #   Invalid input, expected_root is not defined in the referenced
      #   workflow
      #
      # Removing them is also strictly BETTER than keeping them. The
      # expectation is read from the CORPUS CASE ITSELF, which carries
      # expected_closure_root. A constant duplicated into the workflow
      # can drift from the corpus, and a drifted expectation is a check
      # that passes for the wrong reason.